<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            background: #f2f4f7;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .form {
            display: grid;
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .employee {
            background: #f8f9fa;
            border-left: 5px solid #007bff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }

        .employee button {
            margin-top: 10px;
            margin-right: 5px;
            padding: 8px 12px;
        }

        .delete {
            background: #dc3545;
        }

        .delete:hover {
            background: #a71d2a;
        }

        .edit {
            background: #28a745;
        }

        .edit:hover {
            background: #1e7e34;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <div class="form">
        <input type="number" id="id" placeholder="Enter Employee ID">
        <input type="text" id="name" placeholder="Enter Employee Name">
        <input type="text" id="department" placeholder="Enter Department">
        <input type="number" id="salary" placeholder="Enter Salary">

        <button onclick="addEmployee()">Add Employee</button>
    </div>

    <div class="buttons">
        <button onclick="viewEmployees()">View Employees</button>
        <button onclick="searchEmployee()">Search Employee</button>
        <button onclick="clearEmployees()">Clear Display</button>
    </div>

    <p id="message"></p>

    <div id="employeeList"></div>

</div>

<script>

    let employees = [];

    // Add Employee
    function addEmployee() {

        let id = document.getElementById("id").value;
        let name = document.getElementById("name").value;
        let department = document.getElementById("department").value;
        let salary = document.getElementById("salary").value;

        if (id === "" || name === "" || department === "" || salary === "") {
            showMessage("Please fill all fields.");
            return;
        }

        let employee = {
            id: Number(id),
            name: name,
            department: department,
            salary: Number(salary)
        };

        employees.push(employee);

        showMessage("Employee added successfully!");

        clearForm();
        viewEmployees();
    }


    // View Employees
    function viewEmployees() {

        let list = document.getElementById("employeeList");

        list.innerHTML = "";

        if (employees.length === 0) {
            list.innerHTML = "<p>No employees found.</p>";
            return;
        }

        employees.forEach(function(employee, index) {

            list.innerHTML += `
                <div class="employee">

                    <strong>ID:</strong> ${employee.id}<br>
                    <strong>Name:</strong> ${employee.name}<br>
                    <strong>Department:</strong> ${employee.department}<br>
                    <strong>Salary:</strong> ₹${employee.salary}

                    <br>

                    <button class="edit"
                        onclick="updateEmployee(${index})">
                        Update
                    </button>

                    <button class="delete"
                        onclick="deleteEmployee(${index})">
                        Delete
                    </button>

                </div>
            `;
        });
    }


    // Search Employee
    function searchEmployee() {

        let id = prompt("Enter Employee ID to search:");

        if (id === null || id === "") {
            return;
        }

        let employee = employees.find(function(e) {
            return e.id === Number(id);
        });

        let list = document.getElementById("employeeList");

        list.innerHTML = "";

        if (employee) {

            list.innerHTML = `
                <div class="employee">

                    <strong>ID:</strong> ${employee.id}<br>
                    <strong>Name:</strong> ${employee.name}<br>
                    <strong>Department:</strong> ${employee.department}<br>
                    <strong>Salary:</strong> ₹${employee.salary}

                </div>
            `;

            showMessage("Employee found!");

        } else {

            showMessage("Employee not found.");
        }
    }


    // Update Employee
    function updateEmployee(index) {

        let employee = employees[index];

        let newName = prompt("Enter new name:", employee.name);

        if (newName === null) {
            return;
        }

        let newDepartment = prompt(
            "Enter new department:",
            employee.department
        );

        if (newDepartment === null) {
            return;
        }

        let newSalary = prompt(
            "Enter new salary:",
            employee.salary
        );

        if (newSalary === null) {
            return;
        }

        employee.name = newName;
        employee.department = newDepartment;
        employee.salary = Number(newSalary);

        showMessage("Employee updated successfully!");

        viewEmployees();
    }


    // Delete Employee
    function deleteEmployee(index) {

        let confirmDelete = confirm(
            "Are you sure you want to delete this employee?"
        );

        if (confirmDelete) {

            employees.splice(index, 1);

            showMessage("Employee deleted successfully!");

            viewEmployees();
        }
    }


    // Clear Display
    function clearEmployees() {

        document.getElementById("employeeList").innerHTML = "";
        document.getElementById("message").innerHTML = "";
    }


    // Clear Form
    function clearForm() {

        document.getElementById("id").value = "";
        document.getElementById("name").value = "";
        document.getElementById("department").value = "";
        document.getElementById("salary").value = "";
    }


    // Message
    function showMessage(message) {

        document.getElementById("message").innerText = message;

        setTimeout(function() {
            document.getElementById("message").innerText = "";
        }, 2000);
    }

</script>

</body>
</html>
